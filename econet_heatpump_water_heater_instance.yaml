water_heater:
  - platform: template
    id: ${p}_econet_water_heater
    name: None
    visual:
      min_temperature: 110 °F
      max_temperature: 140 °F
      target_temperature_step: 1
    current_temperature: !lambda |-
      const float temp = id(${p}_econet_climate).current_temperature;
      if (std::isnan(temp)) {
        return {};
      }
      return temp;
    target_temperature: !lambda |-
      const float temp = id(${p}_econet_climate).target_temperature;
      if (std::isnan(temp)) {
        return {};
      }
      return temp;
    is_on: !lambda |-
      if (id(${p}_econet_climate).mode == climate::CLIMATE_MODE_OFF) {
        return false;
      }
      if (id(${p}_econet_climate).has_custom_preset()) {
        if (id(${p}_econet_climate).get_custom_preset() == "Off") {
          return false;
        }
      }
      return true;
    mode: "if (id(${p}_econet_climate).mode == climate::CLIMATE_MODE_OFF) {\n  return\
      \ water_heater::WATER_HEATER_MODE_OFF;\n}\nif (id(${p}_econet_climate).has_custom_preset())\
      \ {\n  auto preset = id(${p}_econet_climate).get_custom_preset();\n  if (preset\
      \ == \"Energy Saver\" || preset == \"Eco Mode\") {\n    return water_heater::WATER_HEATER_MODE_ECO;\n\
      \  }\n  if (preset == \"Performance\") {\n    return water_heater::WATER_HEATER_MODE_PERFORMANCE;\n\
      \  }\n  if (preset == \"Heat Pump\") {\n    return water_heater::WATER_HEATER_MODE_HEAT_PUMP;\n\
      \  }\n  if (preset == \"High Demand\") {\n    return water_heater::WATER_HEATER_MODE_HIGH_DEMAND;\n\
      \  }\n  if (preset == \"Electric\") {\n    return water_heater::WATER_HEATER_MODE_ELECTRIC;\n\
      \  }\n  if (preset == \"Off\") {\n    return water_heater::WATER_HEATER_MODE_OFF;\n\
      \  }\n}\nreturn water_heater::WATER_HEATER_MODE_HEAT_PUMP;"
    set_action:
      - climate.control:
          id: ${p}_econet_climate
          target_temperature: !lambda |-
            return id(${p}_econet_water_heater).get_target_temperature();
          mode: !lambda |-
            const bool req_on = id(${p}_econet_water_heater).is_on();
            const auto req_mode = id(${p}_econet_water_heater).get_mode();
            const auto climate_mode = id(${p}_econet_climate).mode;

            // Turn off: was on, now requested off.
            if (!req_on && climate_mode != climate::CLIMATE_MODE_OFF) {
              return climate::CLIMATE_MODE_OFF;
            }
            // Turn on via action: was off, now requested on.
            if (req_on && climate_mode == climate::CLIMATE_MODE_OFF) {
              return climate::CLIMATE_MODE_HEAT;
            }
            // Mode selected from UI while off: implicit turn on.
            if (!req_on &&
                req_mode != water_heater::WATER_HEATER_MODE_OFF &&
                climate_mode == climate::CLIMATE_MODE_OFF) {
              return climate::CLIMATE_MODE_HEAT;
            }
            if (req_mode == water_heater::WATER_HEATER_MODE_OFF) {
              return climate::CLIMATE_MODE_OFF;
            }
            return climate::CLIMATE_MODE_HEAT;
          custom_preset: !lambda |-
            const bool req_on = id(${p}_econet_water_heater).is_on();
            const auto req_mode = id(${p}_econet_water_heater).get_mode();
            const auto climate_mode = id(${p}_econet_climate).mode;

            // Turn off: save current preset before switching off.
            if (!req_on && climate_mode != climate::CLIMATE_MODE_OFF) {
              if (id(${p}_econet_climate).has_custom_preset()) {
                const auto current = id(${p}_econet_climate).get_custom_preset();
                if (current != "Off") {
                  id(${p}_wh_last_active_preset) = current;
                }
              }
              return {"Off"};
            }

            // Turn on via action: mode_ is corrupted to OFF by the loop,
            // so restore the last saved preset.
            if (climate_mode == climate::CLIMATE_MODE_OFF &&
                req_mode == water_heater::WATER_HEATER_MODE_OFF) {
              return {id(${p}_wh_last_active_preset)};
            }

            // Mode change (while on, or selected from UI while off):
            // map mode to preset, save it, and apply.
            std::string preset;
            if (req_mode == water_heater::WATER_HEATER_MODE_ECO) {
              preset = "Eco Mode";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_PERFORMANCE) {
              preset = "Performance";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_HEAT_PUMP) {
              preset = "Heat Pump";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_HIGH_DEMAND) {
              preset = "High Demand";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_ELECTRIC) {
              preset = "Electric";
            } else if (req_mode == water_heater::WATER_HEATER_MODE_GAS) {
              preset = "Heat Pump";
            } else {
              preset = "Off";
            }

            if (preset != "Off") {
              id(${p}_wh_last_active_preset) = preset;
            }
            return {preset};
      - lambda: 'auto call = id(${p}_vaca_net).make_call(); call.set_option(id(${p}_econet_water_heater).is_away()
          ? "Permanent" : "Off"); call.perform();'
    away: !lambda |-
      return id(${p}_vaca_net).current_option() == "Permanent";
    supported_modes:
      - 'OFF'
      - ECO
      - HEAT_PUMP
      - HIGH_DEMAND
      - ELECTRIC
    device_id: ${device}
api:
  actions:
    - action: ${p}_read
      variables:
        datapoint_id: string
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              std::map<std::string, std::string> result = id(${p}_econet_id).homeassistant_read(datapoint_id);
              for (auto const& item : result) {
                root[item.first] = item.second;
              }
    - action: ${p}_read_from_address
      variables:
        datapoint_id: string
        address: int
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              std::map<std::string, std::string> result = id(${p}_econet_id).homeassistant_read(datapoint_id, address);
              for (auto const& item : result) {
                root[item.first] = item.second;
              }
    - action: ${p}_write_enum
      variables:
        datapoint_id: string
        value: int
      then:
        - lambda: id(${p}_econet_id).homeassistant_write(datapoint_id, (uint8_t) value);
    - action: ${p}_write_enum_from_address
      variables:
        datapoint_id: string
        value: int
        address: int
      then:
        - lambda: id(${p}_econet_id).homeassistant_write(datapoint_id, (uint8_t) value,
            address);
    - action: ${p}_write_float
      variables:
        datapoint_id: string
        value: float
      then:
        - lambda: id(${p}_econet_id).homeassistant_write(datapoint_id, value);
    - action: ${p}_write_float_from_address
      variables:
        datapoint_id: string
        value: float
        address: int
      then:
        - lambda: id(${p}_econet_id).homeassistant_write(datapoint_id, value, address);
